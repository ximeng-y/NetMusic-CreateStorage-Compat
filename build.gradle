plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = 'com.xm2nd'
version = '1.1.1'

base {
    archivesName = 'netmusic-create-storage-compat'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

dependencies {
    // Create:Storage（fxntstorage）与 NetMusic：仅编译期引用，
    // 运行时由用户 mods 目录提供（不打包、不 jarJar）
    compileOnly files('reference/fxntstorage-1.3.2+mc-1.21.1-neoforge.jar')
    compileOnly files('reference/netmusic-1.5.1-neoforge+mc1.21.1.jar')
}

neoForge {
    version = '21.1.219'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        netmusic_create_storage_compat {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes([
                'Specification-Title'   : 'netmusic-create-storage-compat',
                'Specification-Version' : '1.0.0',
                'Implementation-Title'  : 'NetMusic-CreateStorage-Compat',
                'Implementation-Version': '1.0.0',
        ])
    }
}
